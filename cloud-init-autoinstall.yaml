#cloud-config
autoinstall:
  version: 1
  interactive-sections:
    - none
  identity:
    hostname: ai-pipeline-server
    username: admin
    # Hashed password for "admin123" (Generate yours with: openssl passwd -6)
    password: "$6$exDY1mhS4KUYCE/2$zmn9ToZwTKLhCw.b4/b.ZRTIZM30JZ4QrOQ2aOXJ8yk96xpcCof0kxKwuX1kqLG/ygbJ1f8wxED22bTL4F46P0"
  ssh:
    install-server: true
    allow-pw: true
  storage:
    layout:
      name: direct
  package_upgrade: true
  packages:
    - curl
    - wget
    - git
    - build-essential
    - nginx
    - openssh-server
    - dotnet-sdk-8.0
    - aspnetcore-runtime-8.0
    # ---- Python 3.11 (required by UniRig, compatible with ComfyUI-3D-Pack) ----
    - python3.11
    - python3.11-dev
    - python3.11-venv
    - python3-pip
    # ---- Build tools for CUDA extensions ----
    - cmake
    - ninja-build
    - ffmpeg
    # ---- OpenGL / EGL / Mesa (required by nvdiffrast, pytorch3d, open3d) ----
    - libegl1
    - libegl1-mesa-dev
    - libgl1
    - libgl1-mesa-dev
    - libgl1-mesa-glx
    - libgles2
    - libgles2-mesa-dev
    - libglib2.0-0
    - libglvnd-dev
    - libglvnd0
    - libglx0
    - libsm6
    - libxext6
    - libxrender1
    # ---- Fortran compiler (needed if any package builds scipy from source) ----
    - gfortran
  runcmd:
    # =================================================================
    # 1. NVIDIA CUDA 13.2 + Driver 595 (RTX Pro 4000 / Ada Lovelace)
    # =================================================================
    # CUDA 13.2 requires driver >= 595.45.04
    - wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
    - dpkg -i cuda-keyring_1.1-1_all.deb
    - apt-get update
    - apt-get install -y cuda-toolkit-13-2 nvidia-driver-595
    # Set CUDA environment for all users
    - |
      cat <<'EOF' > /etc/profile.d/cuda.sh
      export PATH=/usr/local/cuda-13.2/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/cuda-13.2/lib64:$LD_LIBRARY_PATH
      export CUDA_HOME=/usr/local/cuda-13.2
      export PYOPENGL_PLATFORM=egl
      EOF
    - chmod 644 /etc/profile.d/cuda.sh
    # Also install CUDA 12.8 toolkit (dual CUDA for spconv/cumm compilation)
    - apt-get install -y cuda-toolkit-12-8
    # =================================================================
    # 2. Tailscale
    # =================================================================
    - curl -fsSL https://tailscale.com/install.sh | sh
    # =================================================================
    # 3. Python 3.12 setup
    # =================================================================
    - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
    - update-alternatives --install /usr/bin/python python /usr/bin/python3.11 1
    - curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
    # =================================================================
    # 4. Install ComfyUI + ComfyUI-3D-Pack (CUDA 13.x fork)
    # =================================================================
    - |
      sudo -u admin bash -c '
        source /etc/profile.d/cuda.sh

        # --- Clone ComfyUI ---
        git clone https://github.com/comfyanonymous/ComfyUI.git /home/admin/ComfyUI
        cd /home/admin/ComfyUI

        # --- Create venv inside ComfyUI ---
        python3.11 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel

        # --- PyTorch 2.9.1 + CUDA 13.0 ---
        pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 \
          --extra-index-url https://download.pytorch.org/whl/cu130

        # --- ComfyUI base requirements ---
        pip install -r requirements.txt

        # --- xformers (prebuilt cu130 wheel on Linux) ---
        pip install xformers==0.0.34 \
          --extra-index-url https://download.pytorch.org/whl/cu130

        # ===========================================================
        # Clone all custom nodes
        # ===========================================================
        cd custom_nodes

        # ---- 3D Generation & Processing ----
        # ComfyUI-3D-Pack (CUDA 13 compatible fork) - Gaussian splatting, NeRF, mesh gen
        git clone -b cuda13-compat https://github.com/jaiporterscott/ComfyUI-3D-Pack.git
        # TRELLIS2 - Microsoft image-to-3D with PBR materials
        git clone https://github.com/PozzettiAndrea/ComfyUI-TRELLIS2.git
        # GeometryPack - Professional mesh ops: remesh, UV unwrap, hole fill, decimation
        git clone https://github.com/PozzettiAndrea/ComfyUI-GeometryPack.git

        # ---- Rigging & Animation ----
        # UniRig - Auto-rigging (bundles Blender + UniRig model)
        git clone https://github.com/PozzettiAndrea/ComfyUI-UniRig.git
        # MotionCapture - Video to SMPL 3D skeletal motion capture
        git clone https://github.com/PozzettiAndrea/ComfyUI-MotionCapture.git
        # Frame interpolation - RIFE, FILM for smooth animation
        git clone https://github.com/Fannovel16/ComfyUI-Frame-Interpolation.git

        # ---- Body & Character ----
        # SAM3DBody - 3D body mesh extraction with body-part segmentation
        git clone https://github.com/PozzettiAndrea/ComfyUI-SAM3DBody.git

        # ---- Texturing & PBR Materials ----
        # TextureAlchemy - PBR extractor, combiner, height-to-normal
        git clone https://github.com/amtarr/ComfyUI-TextureAlchemy.git
        # PBRFusion - Diffusion-based PBR map generation (normal, height, roughness)
        git clone https://github.com/Night1099/COMFYUI-PBRFusion4.git

        # ---- ControlNet & Pose ----
        # ControlNet Aux - OpenPose, depth, normal, canny preprocessors
        git clone https://github.com/Fannovel16/comfyui_controlnet_aux.git
        # IPAdapter Plus - Style transfer via reference images + FaceID
        git clone https://github.com/cubiq/ComfyUI_IPAdapter_plus.git

        # ---- Segmentation ----
        # SAM2 - Meta Segment Anything 2 for video/image segmentation
        git clone https://github.com/kijai/ComfyUI-segment-anything-2.git
        # GroundingDino SAM - Text-prompted segmentation ("remove the chair")
        git clone https://github.com/storyicon/comfyui_segment_anything.git
        # Background removal
        git clone https://github.com/Jcd1230/rembg-comfyui-node.git

        # ---- Upscaling ----
        # UltimateSDUpscale - Tile-based diffusion upscaling
        git clone --recursive https://github.com/ssitu/ComfyUI_UltimateSDUpscale.git

        # ---- Essential Workflow Nodes ----
        # Impact Pack - Face detailer, upscale pipeline (~40% of pro workflows use this)
        git clone https://github.com/ltdrdata/ComfyUI-Impact-Pack.git
        # KJNodes - Set/Get nodes, animation helpers, shape drawing
        git clone https://github.com/kijai/ComfyUI-KJNodes.git
        # ComfyUI-Manager - Official node installer/registry
        git clone https://github.com/Comfy-Org/ComfyUI-Manager.git
        # Video Helper Suite - Video load/save, frame extraction
        git clone https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git

        # ===========================================================
        # Install shared CUDA dependencies
        # ===========================================================

        # spconv/cumm (cu126 wheels, ABI forward-compatible with CUDA 13.x)
        pip install cumm-cu126 spconv-cu126

        # PyG packages (torch-scatter + torch-cluster for UniRig, SAM3DBody)
        pip install torch-scatter torch-cluster \
          --find-links https://data.pyg.org/whl/torch-2.9.1+cu130.html

        # scipy first (prebuilt wheels), then gpytoolbox (needs --no-build-isolation)
        pip install "scipy>=1.15.0"
        pip install --no-build-isolation gpytoolbox

        # rembg with GPU (onnxruntime-gpu for CUDA-accelerated background removal)
        pip install "rembg[gpu]"

        # insightface (needed by IPAdapter FaceID)
        pip install insightface

        # ===========================================================
        # Install each node's requirements
        # ===========================================================

        # ComfyUI-3D-Pack (heaviest - builds pytorch3d, nvdiffrast, etc.)
        cd ComfyUI-3D-Pack
        pip install -r requirements.txt
        python install.py
        cd ..

        # Install requirements for nodes that have them
        for node_dir in \
          ComfyUI-Impact-Pack \
          ComfyUI-KJNodes \
          ComfyUI-VideoHelperSuite \
          comfyui_controlnet_aux \
          ComfyUI-Frame-Interpolation \
          ComfyUI-TextureAlchemy \
          ComfyUI-UniRig \
          ComfyUI-TRELLIS2 \
          ComfyUI-GeometryPack \
          ComfyUI-MotionCapture \
          ComfyUI-SAM3DBody \
          ComfyUI-segment-anything-2 \
          comfyui_segment_anything \
          COMFYUI-PBRFusion4; do
          if [ -f "$node_dir/requirements.txt" ]; then
            echo "Installing requirements for $node_dir..."
            pip install -r "$node_dir/requirements.txt" || true
          fi
          if [ -f "$node_dir/install.py" ]; then
            echo "Running install.py for $node_dir..."
            cd "$node_dir" && python install.py && cd .. || cd ..
          fi
        done

        echo "============================================"
        echo "ComfyUI + all custom nodes installed!"
        echo "  3D:          3D-Pack, TRELLIS2, GeometryPack"
        echo "  Rigging:     UniRig, MotionCapture"
        echo "  Body:        SAM3DBody"
        echo "  Textures:    TextureAlchemy, PBRFusion4"
        echo "  ControlNet:  controlnet_aux, IPAdapter+"
        echo "  Segment:     SAM2, GroundingDino, rembg"
        echo "  Upscale:     UltimateSDUpscale"
        echo "  Core:        Impact-Pack, KJNodes, Manager"
        echo "============================================"
      '
    # =================================================================
    # 5. ComfyUI systemd service (headless, listen on port 8188)
    # =================================================================
    - |
      cat <<'EOF' > /etc/systemd/system/comfyui.service
      [Unit]
      Description=ComfyUI Server
      After=network.target nvidia-persistenced.service

      [Service]
      Type=simple
      User=admin
      WorkingDirectory=/home/admin/ComfyUI
      ExecStart=/home/admin/ComfyUI/venv/bin/python main.py --listen 0.0.0.0 --port 8188
      Restart=always
      RestartSec=10
      Environment=PATH=/usr/local/cuda-13.2/bin:/home/admin/ComfyUI/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      Environment=LD_LIBRARY_PATH=/usr/local/cuda-13.2/lib64
      Environment=CUDA_HOME=/usr/local/cuda-13.2
      Environment=PYOPENGL_PLATFORM=egl

      [Install]
      WantedBy=multi-user.target
      EOF
    # =================================================================
    # 6. Deployment directory
    # =================================================================
    - mkdir -p /var/www/world-forge
    - chown admin:admin /var/www/world-forge
    # =================================================================
    # 7. .NET App systemd service
    # =================================================================
    - |
      cat <<'EOF' > /etc/systemd/system/world-forge.service
      [Unit]
      Description=.NET AI Pipeline Service
      After=network.target nvidia-persistenced.service

      [Service]
      WorkingDirectory=/var/www/world-forge
      ExecStart=/usr/bin/dotnet /var/www/world-forge/WorldForge.Blazor.dll
      Restart=always
      RestartSec=10
      User=admin
      Environment=ASPNETCORE_URLS=http://localhost:5000
      Environment=ASPNETCORE_ENVIRONMENT=Production
      Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false
      Environment=PATH=/usr/local/cuda-13.2/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      Environment=LD_LIBRARY_PATH=/usr/local/cuda-13.2/lib64
      Environment=CUDA_HOME=/usr/local/cuda-13.2

      [Install]
      WantedBy=multi-user.target
      EOF
    # =================================================================
    # 8. Nginx reverse proxy (HTTP -> HTTPS -> Kestrel)
    # =================================================================
    - |
      cat <<'EOF' > /etc/nginx/sites-available/default
      server {
          listen 80;
          server_name _;
          return 301 https://$host$request_uri;
      }

      server {
          listen 443 ssl;
          server_name _;

          ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
          ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

          location / {
              proxy_pass         http://localhost:5000;
              proxy_http_version 1.1;
              proxy_set_header   Upgrade $http_upgrade;
              proxy_set_header   Connection keep-alive;
              proxy_set_header   Host $host;
              proxy_cache_bypass $http_upgrade;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
          }
      }
      EOF
    # =================================================================
    # 9. Enable services and reboot
    # =================================================================
    - systemctl daemon-reload
    - systemctl enable comfyui.service
    - systemctl enable world-forge.service
    - systemctl enable nginx
    - systemctl restart nginx
    - reboot
