#cloud-config
autoinstall:
  version: 1
  interactive-sections:
    - none
  identity:
    hostname: ai-pipeline-server
    username: admin
    # Hashed password for "admin123" (Generate yours with: openssl passwd -6)
    password: "$6$exDY1mhS4KUYCE/2$zmn9ToZwTKLhCw.b4/b.ZRTIZM30JZ4QrOQ2aOXJ8yk96xpcCof0kxKwuX1kqLG/ygbJ1f8wxED22bTL4F46P0"
  ssh:
    install-server: true
    allow-pw: true
  storage:
    layout:
      name: direct
  package_upgrade: true
  packages:
    - curl
    - wget
    - git
    - build-essential
    - nginx
    - openssh-server
    - dotnet-sdk-8.0
    - aspnetcore-runtime-8.0
    # ---- Python 3.11 (required by UniRig, compatible with all nodes) ----
    - python3.11
    - python3.11-dev
    - python3.11-venv
    - python3-pip
    # ---- Build tools for CUDA extensions ----
    - cmake
    - ninja-build
    - ffmpeg
    # ---- OpenGL / EGL / Mesa (required by nvdiffrast, pytorch3d, open3d) ----
    - libegl1
    - libegl1-mesa-dev
    - libgl1
    - libgl1-mesa-dev
    - libgl1-mesa-glx
    - libgles2
    - libgles2-mesa-dev
    - libglib2.0-0
    - libglvnd-dev
    - libglvnd0
    - libglx0
    - libsm6
    - libxext6
    - libxrender1
    # ---- Fortran compiler (fallback if scipy builds from source) ----
    - gfortran
  runcmd:
    # =================================================================
    # 1. NVIDIA CUDA 12.8 Toolkit + Driver
    # =================================================================
    - wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
    - dpkg -i cuda-keyring_1.1-1_all.deb
    - apt-get update
    - apt-get install -y cuda-toolkit-12-8 nvidia-driver-570
    - |
      cat <<'EOF' > /etc/profile.d/cuda.sh
      export PATH=/usr/local/cuda-12.8/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH
      export CUDA_HOME=/usr/local/cuda-12.8
      export PYOPENGL_PLATFORM=egl
      EOF
    - chmod 644 /etc/profile.d/cuda.sh
    # =================================================================
    # 2. Tailscale
    # =================================================================
    - curl -fsSL https://tailscale.com/install.sh | sh
    # =================================================================
    # 3. Python 3.11 setup
    # =================================================================
    - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
    - update-alternatives --install /usr/bin/python python /usr/bin/python3.11 1
    - curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
    # =================================================================
    # 4. ComfyUI + 3D Pipeline (PyTorch 2.7.0 + cu126)
    # =================================================================
    - |
      sudo -u admin bash -c '
        source /etc/profile.d/cuda.sh

        # --- Clone ComfyUI ---
        git clone https://github.com/comfyanonymous/ComfyUI.git /home/admin/ComfyUI
        cd /home/admin/ComfyUI

        # --- Create venv ---
        python3.11 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel

        # --- PyTorch 2.7.0 + cu126 (official 3D-Pack stack) ---
        pip install torch==2.7.0 torchvision==0.22.0 torchaudio==2.7.0 \
          --index-url https://download.pytorch.org/whl/cu126

        # --- ComfyUI base requirements ---
        pip install -r requirements.txt

        # --- xformers (prebuilt cu126 wheel) ---
        pip install xformers==0.0.30 --index-url https://download.pytorch.org/whl/cu126

        # ===========================================================
        # Clone all custom nodes
        # ===========================================================
        cd custom_nodes

        # 3D Generation & Processing
        git clone https://github.com/MrForExample/ComfyUI-3D-Pack.git
        git clone https://github.com/PozzettiAndrea/ComfyUI-TRELLIS2.git
        git clone https://github.com/PozzettiAndrea/ComfyUI-GeometryPack.git

        # Rigging & Animation
        git clone https://github.com/PozzettiAndrea/ComfyUI-UniRig.git
        git clone https://github.com/PozzettiAndrea/ComfyUI-MotionCapture.git
        git clone https://github.com/Fannovel16/ComfyUI-Frame-Interpolation.git

        # Body & Character
        git clone https://github.com/PozzettiAndrea/ComfyUI-SAM3DBody.git

        # Texturing & PBR
        git clone https://github.com/amtarr/ComfyUI-TextureAlchemy.git
        git clone https://github.com/Night1099/COMFYUI-PBRFusion4.git

        # ControlNet & Pose
        git clone https://github.com/Fannovel16/comfyui_controlnet_aux.git
        git clone https://github.com/cubiq/ComfyUI_IPAdapter_plus.git

        # Segmentation
        git clone https://github.com/kijai/ComfyUI-segment-anything-2.git
        git clone https://github.com/storyicon/comfyui_segment_anything.git
        git clone https://github.com/Jcd1230/rembg-comfyui-node.git

        # Upscaling
        git clone --recursive https://github.com/ssitu/ComfyUI_UltimateSDUpscale.git

        # Essential Workflow
        git clone https://github.com/ltdrdata/ComfyUI-Impact-Pack.git
        git clone https://github.com/kijai/ComfyUI-KJNodes.git
        git clone https://github.com/Comfy-Org/ComfyUI-Manager.git
        git clone https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git

        # ===========================================================
        # Shared CUDA dependencies
        # ===========================================================

        # spconv + cumm (prebuilt cu126)
        pip install cumm-cu126 spconv-cu126

        # PyG packages
        pip install torch-scatter torch-cluster \
          --find-links https://data.pyg.org/whl/torch-2.7.0+cu126.html

        # scipy before gpytoolbox
        pip install "scipy>=1.15.0"
        pip install --no-build-isolation gpytoolbox

        # rembg GPU + insightface (for IPAdapter FaceID)
        pip install "rembg[gpu]" insightface

        # ===========================================================
        # Install each node requirements + build CUDA extensions
        # ===========================================================

        # 3D-Pack first (heaviest)
        cd ComfyUI-3D-Pack
        pip install -r requirements.txt
        python install.py
        cd ..

        # All other nodes
        for node_dir in \
          ComfyUI-Impact-Pack \
          ComfyUI-KJNodes \
          ComfyUI-VideoHelperSuite \
          comfyui_controlnet_aux \
          ComfyUI-Frame-Interpolation \
          ComfyUI-TextureAlchemy \
          ComfyUI-UniRig \
          ComfyUI-TRELLIS2 \
          ComfyUI-GeometryPack \
          ComfyUI-MotionCapture \
          ComfyUI-SAM3DBody \
          ComfyUI-segment-anything-2 \
          comfyui_segment_anything \
          COMFYUI-PBRFusion4; do
          if [ -f "$node_dir/requirements.txt" ]; then
            echo "Installing requirements for $node_dir..."
            pip install -r "$node_dir/requirements.txt" || true
          fi
          if [ -f "$node_dir/install.py" ]; then
            echo "Running install.py for $node_dir..."
            cd "$node_dir" && python install.py && cd .. || cd ..
          fi
        done

        echo "============================================"
        echo "ComfyUI + all custom nodes installed!"
        echo "============================================"
      '
    # =================================================================
    # 5. ComfyUI systemd service (port 8188)
    # =================================================================
    - |
      cat <<'EOF' > /etc/systemd/system/comfyui.service
      [Unit]
      Description=ComfyUI Server
      After=network.target nvidia-persistenced.service

      [Service]
      Type=simple
      User=admin
      WorkingDirectory=/home/admin/ComfyUI
      ExecStart=/home/admin/ComfyUI/venv/bin/python main.py --listen 0.0.0.0 --port 8188
      Restart=always
      RestartSec=10
      Environment=PATH=/usr/local/cuda-12.8/bin:/home/admin/ComfyUI/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      Environment=LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64
      Environment=CUDA_HOME=/usr/local/cuda-12.8
      Environment=PYOPENGL_PLATFORM=egl

      [Install]
      WantedBy=multi-user.target
      EOF
    # =================================================================
    # 6. Deployment directory
    # =================================================================
    - mkdir -p /var/www/world-forge
    - chown admin:admin /var/www/world-forge
    # =================================================================
    # 7. .NET App systemd service
    # =================================================================
    - |
      cat <<'EOF' > /etc/systemd/system/world-forge.service
      [Unit]
      Description=.NET AI Pipeline Service
      After=network.target nvidia-persistenced.service

      [Service]
      WorkingDirectory=/var/www/world-forge
      ExecStart=/usr/bin/dotnet /var/www/world-forge/WorldForge.Blazor.dll
      Restart=always
      RestartSec=10
      User=admin
      Environment=ASPNETCORE_URLS=http://localhost:5000
      Environment=ASPNETCORE_ENVIRONMENT=Production
      Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false

      [Install]
      WantedBy=multi-user.target
      EOF
    # =================================================================
    # 8. Nginx reverse proxy
    # =================================================================
    - |
      cat <<'EOF' > /etc/nginx/sites-available/default
      server {
          listen 80;
          server_name _;
          return 301 https://$host$request_uri;
      }

      server {
          listen 443 ssl;
          server_name _;

          ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
          ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

          location / {
              proxy_pass         http://localhost:5000;
              proxy_http_version 1.1;
              proxy_set_header   Upgrade $http_upgrade;
              proxy_set_header   Connection keep-alive;
              proxy_set_header   Host $host;
              proxy_cache_bypass $http_upgrade;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
          }
      }
      EOF
    # =================================================================
    # 9. Enable services and reboot
    # =================================================================
    - systemctl daemon-reload
    - systemctl enable comfyui.service
    - systemctl enable world-forge.service
    - systemctl enable nginx
    - systemctl restart nginx
    - reboot
